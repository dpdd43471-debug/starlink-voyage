<script type="text/babel">
const { useState, useEffect, useRef, useCallback, createElement: h, Fragment } = React;
const { motion, AnimatePresence } = window.Motion;

// ─── FadingVideo ───────────────────────────────────────────────
const FADING_VIDEO_URL_1 = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_080021_d598092b-c4c2-4e53-8e46-94cf9064cd50.mp4";
const FADING_VIDEO_URL_2 = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_094631_d30ab262-45ee-4b7d-99f3-5d5848c8ef13.mp4";

const FADE_MS = 500;
const FADE_OUT_LEAD = 0.55;

function FadingVideo({ src, className, style }) {
  const videoRef = useRef(null);
  const rafRef = useRef(null);
  const fadingOutRef = useRef(false);

  const fadeTo = useCallback((target, duration = FADE_MS) => {
    const video = videoRef.current;
    if (!video) return;
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    const start = parseFloat(video.style.opacity) || 0;
    const startTime = performance.now();
    const step = (now) => {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      video.style.opacity = start + (target - start) * progress;
      if (progress < 1) {
        rafRef.current = requestAnimationFrame(step);
      } else {
        rafRef.current = null;
      }
    };
    rafRef.current = requestAnimationFrame(step);
  }, []);

  useEffect(() => {
    const video = videoRef.current;
    if (!video) return;

    const onLoaded = () => {
      video.style.opacity = "0";
      video.play();
      fadeTo(1);
    };

    const onTimeUpdate = () => {
      if (!fadingOutRef.current && video.duration - video.currentTime <= FADE_OUT_LEAD && video.duration - video.currentTime > 0) {
        fadingOutRef.current = true;
        fadeTo(0);
      }
    };

    const onEnded = () => {
      video.style.opacity = "0";
      setTimeout(() => {
        if (!videoRef.current) return;
        video.currentTime = 0;
        video.play();
        fadingOutRef.current = false;
        fadeTo(1);
      }, 100);
    };

    video.addEventListener("loadeddata", onLoaded);
    video.addEventListener("timeupdate", onTimeUpdate);
    video.addEventListener("ended", onEnded);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      video.removeEventListener("loadeddata", onLoaded);
      video.removeEventListener("timeupdate", onTimeUpdate);
      video.removeEventListener("ended", onEnded);
    };
  }, [fadeTo]);

  return h("video", {
    ref: videoRef,
    src,
    autoPlay: true,
    muted: true,
    playsInline: true,
    preload: "auto",
    className,
    style: { opacity: 0, ...style },
  });
}

// ─── BlurText ──────────────────────────────────────────────────
function BlurText({ text }) {
  const containerRef = useRef(null);
  const [inView, setInView] = useState(false);
  const words = text.split(" ");

  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const observer = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setInView(true);
          observer.disconnect();
        }
      },
      { threshold: 0.1 }
    );
    observer.observe(el);
    return () => observer.disconnect();
  }, []);

  return h("p", {
    ref: containerRef,
    style: { display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" },
    className: "text-6xl md:text-7xl lg:text-[5.5rem] font-heading italic text-white leading-[0.8] max-w-2xl tracking-[-4px]",
  },
    words.map((word, i) =>
      h(motion.span, {
        key: i,
        initial: { filter: "blur(10px)", opacity: 0, y: 50 },
        animate: inView ? {
          filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
          opacity: [0, 0.5, 1],
          y: [50, -5, 0],
        } : {},
        transition: {
          duration: 0.7,
          times: [0, 0.5, 1],
          ease: "easeOut",
          delay: (i * 100) / 1000,
        },
        style: { display: "inline-block", marginRight: "0.28em" },
      }, word)
    )
  );
}

<!-- ═══════════════════════════════════════════════
     INTERACTIVE ENGINE (Vanilla JS)
     ═══════════════════════════════════════════════ -->
<script>
(function() {
  'use strict';

  // ── Wait for React to render ──
  function onReady(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn);
    } else {
      // Small delay to let React finish
      setTimeout(fn, 50);
    }
  }

  onReady(function() {

    // ═════════════════════════════════════════════
    // 1. RIPPLE EFFECT
    // ═════════════════════════════════════════════
    function initRipples() {
      document.querySelectorAll('[data-cta]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          var ripple = document.createElement('span');
          ripple.className = 'ripple-effect';
          var rect = btn.getBoundingClientRect();
          var size = Math.max(rect.width, rect.height);
          ripple.style.width = ripple.style.height = size + 'px';
          ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
          ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
          btn.appendChild(ripple);
          ripple.addEventListener('animationend', function() { ripple.remove(); });
        });
      });
    }

    // ═════════════════════════════════════════════
    // 2. MODAL SYSTEM
    // ═════════════════════════════════════════════
    var modalOverlay, modalPanel;

    function createModal() {
      modalOverlay = document.createElement('div');
      modalOverlay.className = 'modal-overlay';
      modalOverlay.innerHTML = '<div class="modal-panel" style="position:relative">' +
        '<button class="modal-close">&times;</button>' +
        '<h3 style="font-family:\'Instrument Serif\',serif;font-style:italic;color:#fff;font-size:1.75rem;margin:0 0 0.5rem;letter-spacing:-1px">Launch Your Voyage</h3>' +
        '<p style="color:rgba(255,255,255,0.6);font-family:\'Barlow\',sans-serif;font-size:0.8rem;margin:0 0 1.5rem;line-height:1.4">Reserve your seat aboard the next-generation spacecraft. A crew specialist will contact you within 24 hours.</p>' +
        '<div style="display:flex;flex-direction:column;gap:0.75rem">' +
        '<input class="modal-input" type="text" placeholder="Full Name" />' +
        '<input class="modal-input" type="email" placeholder="Email Address" />' +
        '<select class="modal-input" style="appearance:none;cursor:pointer"><option value="">Select Destination</option><option>Mars Orbit</option><option>Lunar Base</option><option>Deep Space</option></select>' +
        '<button class="modal-submit" id="modal-submit-btn">Confirm Reservation</button>' +
        '</div></div>';
      document.body.appendChild(modalOverlay);
      modalPanel = modalOverlay.querySelector('.modal-panel');

      // Close handlers
      modalOverlay.addEventListener('click', function(e) {
        if (e.target === modalOverlay) closeModal();
      });
      modalOverlay.querySelector('.modal-close').addEventListener('click', closeModal);
      modalOverlay.querySelector('#modal-submit-btn').addEventListener('click', function() {
        closeModal();
        showToast('Reservation confirmed! Welcome aboard.');
        triggerCartPop();
      });
    }

    function openModal() {
      if (!modalOverlay) createModal();
      modalOverlay.classList.add('active');
      document.body.classList.add('no-scroll');
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      document.body.classList.remove('no-scroll');
    }

    // Bind CTAs to modal
    function bindModalTriggers() {
      document.querySelectorAll('[data-cta="claim-spot"], [data-cta="start-voyage"]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          openModal();
        });
      });
    }

    // ═════════════════════════════════════════════
    // 3. TOAST NOTIFICATION SYSTEM
    // ═════════════════════════════════════════════
    var toastContainer;

    function createToastContainer() {
      toastContainer = document.createElement('div');
      toastContainer.className = 'toast-container';
      document.body.appendChild(toastContainer);
    }

    function showToast(message) {
      if (!toastContainer) createToastContainer();
      var toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = '<span class="toast-dot"></span>' + message;
      toastContainer.appendChild(toast);
      toast.addEventListener('animationend', function(e) {
        if (e.animationName === 'toast-out') toast.remove();
      });
    }

    // ═════════════════════════════════════════════
    // 4. CART BADGE
    // ═════════════════════════════════════════════
    var cartCount = 0;
    var cartCountEl;

    function triggerCartPop() {
      cartCount++;
      cartCountEl = cartCountEl || document.getElementById('cart-count');
      if (cartCountEl) {
        cartCountEl.textContent = cartCount;
        cartCountEl.classList.remove('pop');
        void cartCountEl.offsetWidth;
        cartCountEl.classList.add('pop');
      }
    }

    // Cart icon click also triggers pop
    function bindCartClick() {
      var cartTrigger = document.getElementById('cart-trigger');
      if (cartTrigger) {
        cartTrigger.addEventListener('click', function() {
          triggerCartPop();
          showToast('Item added to launch manifest');
        });
      }
    }

    // ═════════════════════════════════════════════
    // 5. MOBILE MENU
    // ═════════════════════════════════════════════
    var mobileOverlay, mobilePanel, hamburgerBtn;
    var menuOpen = false;

    function createMobileMenu() {
      // Overlay
      mobileOverlay = document.createElement('div');
      mobileOverlay.className = 'mobile-menu-overlay';
      document.body.appendChild(mobileOverlay);

      // Panel
      mobilePanel = document.createElement('div');
      mobilePanel.className = 'mobile-menu-panel';
      var links = ['Home', 'Voyages', 'Worlds', 'Innovation', 'Plan Launch'];
      var linksHTML = links.map(function(l) {
        return '<a href="#" data-mobile-link="' + l.toLowerCase().replace(/\s+/g, '-') + '">' + l + '</a>';
      }).join('');
      linksHTML += '<a href="#" data-mobile-link="claim-spot" style="background:#fff;color:#000;text-align:center;margin-top:auto;font-weight:600">Claim a Spot</a>';
      mobilePanel.innerHTML = linksHTML;
      document.body.appendChild(mobilePanel);

      // Close on overlay click
      mobileOverlay.addEventListener('click', closeMobileMenu);

      // Panel link clicks
      mobilePanel.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          if (link.getAttribute('data-mobile-link') === 'claim-spot') {
            closeMobileMenu();
            setTimeout(openModal, 350);
          } else {
            closeMobileMenu();
            showToast('Navigating to ' + link.textContent.trim() + '...');
          }
        });
      });
    }

    function toggleMobileMenu() {
      if (!mobileOverlay) createMobileMenu();
      menuOpen = !menuOpen;
      hamburgerBtn = hamburgerBtn || document.getElementById('hamburger-btn');
      if (menuOpen) {
        mobileOverlay.classList.add('active');
        mobilePanel.classList.add('active');
        if (hamburgerBtn) hamburgerBtn.classList.add('active');
        document.body.classList.add('no-scroll');
      } else {
        closeMobileMenu();
      }
    }

    function closeMobileMenu() {
      menuOpen = false;
      if (mobileOverlay) mobileOverlay.classList.remove('active');
      if (mobilePanel) mobilePanel.classList.remove('active');
      if (hamburgerBtn) hamburgerBtn.classList.remove('active');
      document.body.classList.remove('no-scroll');
    }

    function bindMobileMenu() {
      var btn = document.getElementById('hamburger-btn');
      if (btn) {
        btn.addEventListener('click', toggleMobileMenu);
      }
    }

    // ═════════════════════════════════════════════
    // 6. NUMBER COUNTER (IntersectionObserver)
    // ═════════════════════════════════════════════
    function initCounters() {
      var counters = document.querySelectorAll('.stat-number[data-stat-value]');
      if (!counters.length) return;

      var animated = new Set();

      function animateCounter(el) {
        if (animated.has(el)) return;
        animated.add(el);

        var target = parseFloat(el.getAttribute('data-stat-value'));
        var suffix = el.getAttribute('data-stat-suffix') || '';
        var duration = 1800;
        var startTime = null;
        var decimals = (target % 1 !== 0) ? 1 : 0;

        function step(timestamp) {
          if (!startTime) startTime = timestamp;
          var progress = Math.min((timestamp - startTime) / duration, 1);
          // Ease-out cubic
          var eased = 1 - Math.pow(1 - progress, 3);
          var current = eased * target;
          el.textContent = current.toFixed(decimals) + suffix;
          if (progress < 1) {
            requestAnimationFrame(step);
          } else {
            el.textContent = target.toFixed(decimals) + suffix;
          }
        }

        requestAnimationFrame(step);
      }

      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            animateCounter(entry.target);
          }
        });
      }, { threshold: 0.5 });

      counters.forEach(function(c) { observer.observe(c); });
    }

    // ═════════════════════════════════════════════
    // 7. "View Liftoff" CTA – special action
    // ═════════════════════════════════════════════
    function bindViewLiftoff() {
      var btn = document.querySelector('[data-cta="view-liftoff"]');
      if (btn) {
        btn.addEventListener('click', function(e) {
          showToast('Live feed loading... Stand by for liftoff.');
        });
      }
    }

    // ═════════════════════════════════════════════
    // 8. NAV LINK CLICK FEEDBACK
    // ═════════════════════════════════════════════
    function bindNavLinks() {
      document.querySelectorAll('[data-nav-link]').forEach(function(link) {
        link.addEventListener('click', function(e) {
          var label = link.textContent.trim();
          showToast('Exploring ' + label + '...');
        });
      });
      // Also bind mobile menu links (created dynamically)
    }

    // ═════════════════════════════════════════════
    // INIT EVERYTHING
    // ═════════════════════════════════════════════
    function initAll() {
      initRipples();
      bindModalTriggers();
      bindCartClick();
      bindMobileMenu();
      bindViewLiftoff();
      bindNavLinks();
      initCounters();
    }

    // Retry a few times to catch React render
    var retries = 0;
    function tryInit() {
      var ctaEls = document.querySelectorAll('[data-cta]');
      if (ctaEls.length > 0 || retries > 10) {
        initAll();
      } else {
        retries++;
        setTimeout(tryInit, 200);
      }
    }
    tryInit();

  }); // end onReady
})();
</script>
