// ─── FadingVideo ───────────────────────────────────────────────
const FADING_VIDEO_URL_1 = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_080021_d598092b-c4c2-4e53-8e46-94cf9064cd50.mp4";
const FADING_VIDEO_URL_2 = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_094631_d30ab262-45ee-4b7d-99f3-5d5848c8ef13.mp4";

const FADE_MS = 500;
const FADE_OUT_LEAD = 0.55;

function FadingVideo({ src, className, style }) {
  const videoRef = useRef(null);
  const rafRef = useRef(null);
  const fadingOutRef = useRef(false);

  const fadeTo = useCallback((target, duration = FADE_MS) => {
    const video = videoRef.current;
    if (!video) return;
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    const start = parseFloat(video.style.opacity) || 0;
    const startTime = performance.now();
    const step = (now) => {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      video.style.opacity = start + (target - start) * progress;
      if (progress < 1) {
        rafRef.current = requestAnimationFrame(step);
      } else {
        rafRef.current = null;
      }
    };
    rafRef.current = requestAnimationFrame(step);
  }, []);

  useEffect(() => {
    const video = videoRef.current;
    if (!video) return;

    const onLoaded = () => {
      video.style.opacity = "0";
      video.play();
      fadeTo(1);
    };

    const onTimeUpdate = () => {
      if (!fadingOutRef.current && video.duration - video.currentTime <= FADE_OUT_LEAD && video.duration - video.currentTime > 0) {
        fadingOutRef.current = true;
        fadeTo(0);
      }
    };

    const onEnded = () => {
      video.style.opacity = "0";
      setTimeout(() => {
        if (!videoRef.current) return;
        video.currentTime = 0;
        video.play();
        fadingOutRef.current = false;
        fadeTo(1);
      }, 100);
    };

    video.addEventListener("loadeddata", onLoaded);
    video.addEventListener("timeupdate", onTimeUpdate);
    video.addEventListener("ended", onEnded);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      video.removeEventListener("loadeddata", onLoaded);
      video.removeEventListener("timeupdate", onTimeUpdate);
      video.removeEventListener("ended", onEnded);
    };
  }, [fadeTo]);

  return h("video", {
    ref: videoRef,
    src,
    autoPlay: true,
    muted: true,
    playsInline: true,
    preload: "auto",
    className,
    style: { opacity: 0, ...style },
  });
}

// ─── BlurText ──────────────────────────────────────────────────
function BlurText({ text }) {
  const containerRef = useRef(null);
  const [inView, setInView] = useState(false);
  const words = text.split(" ");

  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const observer = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setInView(true);
          observer.disconnect();
        }
      },
      { threshold: 0.1 }
    );
    observer.observe(el);
    return () => observer.disconnect();
  }, []);

  return h("p", {
    ref: containerRef,
    style: { display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" },
    className: "text-6xl md:text-7xl lg:text-[5.5rem] font-heading italic text-white leading-[0.8] max-w-2xl tracking-[-4px]",
  },
    words.map((word, i) =>
      h(motion.span, {
        key: i,
        initial: { filter: "blur(10px)", opacity: 0, y: 50 },
        animate: inView ? {
          filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
          opacity: [0, 0.5, 1],
          y: [50, -5, 0],
        } : {},
        transition: {
          duration: 0.7,
          times: [0, 0.5, 1],
          ease: "easeOut",
          delay: (i * 100) / 1000,
        },
        style: { display: "inline-block", marginRight: "0.28em" },
      }, word)
    )
  );
}
